<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chance Invaders 1978 | Space Invaders Arcade Replica for Amina AAC</title>
  
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Museum-grade 1978 Space Invaders arcade game integrated with Amina AAC: point-and-click touch aiming, single-switch motor accessibility, and voice cheering.">
  <link rel="manifest" href="manifest.json">

  <!-- Arcade & Cabinet Stylesheet -->
  <link rel="stylesheet" href="css/chance-invaders.css">
  <link rel="stylesheet" href="css/aac-theme.css">
</head>
<body>

  <!-- Top Navigation Bar (Amina AAC Return & Accessibility Tools) -->
  <header class="arcade-header-bar" role="banner">
    <div class="arcade-brand-group">
      <a href="index.html" class="arcade-nav-btn" title="Return to AAC Communication Board">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>AAC Board</span>
      </a>
      <button class="arcade-nav-btn accent-talk" id="btn-send-score-aac" title="Send your current score & game phrase to the AAC Sentence Strip">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Send to Board</span>
      </button>
    </div>

    <div class="arcade-brand-group">
      <button class="arcade-nav-btn accent-switch" id="btn-toggle-switch-mode" title="Toggle 1-Switch Assistance: Cannon sweeps automatically, any tap/switch fires!">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 14.83 4.24 4.24"/></svg>
        <span id="label-switch-mode">♿ 1-Switch: OFF</span>
      </button>
      <button class="arcade-nav-btn" id="btn-toggle-voice-cheers" title="Toggle Amina Voice Cheering for wave clears & powerups">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <span id="label-voice-cheers">🗣️ Cheer: ON</span>
      </button>
    </div>
  </header>

  <!-- Retro Arcade Cabinet -->
  <main class="arcade-cabinet" role="main">
    
    <!-- Cabinet Marquee -->
    <header class="marquee">
      <div class="marquee-title">
        <span>CHANCE INVADERS</span>
        <span class="marquee-badge">1978</span>
      </div>
      <div class="marquee-meta" id="marqueeStatus">
        TAITO ARCADE
      </div>
    </header>

    <!-- CRT Screen Housing -->
    <div class="crt-housing curved" id="crtHousing">
      <!-- 1978 Lunar Backdrop Canvas (Pepper's Ghost Optical Illusion) -->
      <canvas id="backdropCanvas" width="448" height="512" aria-hidden="true"></canvas>

      <!-- Game Canvas (448x512 native scale) -->
      <canvas id="gameCanvas" width="448" height="512" aria-label="Space Invaders Arcade Game Screen"></canvas>
      
      <!-- Scanlines & Glare Overlays -->
      <div class="crt-scanlines" id="crtScanlines"></div>
      <div class="crt-glass-glare"></div>
    </div>

    <!-- 1978 Cabinet Angled Mirror Shelf Reflection -->
    <div class="cab-mirror-shelf" id="cabMirrorShelf" title="Pepper's Ghost Mirror Reflection">
      <canvas id="mirrorCanvas" width="448" height="80"></canvas>
    </div>

    <!-- Arcade Control Panel -->
    <section class="control-panel" aria-label="Arcade Controls">
      
      <!-- Top Functional Buttons: Coin, 1P Start, Overlay Mode -->
      <div class="panel-top-row">
        <div class="arcade-btn-group">
          <button id="btnCoin" class="btn-arcade btn-coin" title="Insert 25¢ Coin (Keyboard: Enter)">
            🪙 25¢ INSERT
          </button>
          <button id="btnStart" class="btn-arcade btn-start" title="1-Player Start (Keyboard: 1 or Enter)">
            1 PLAYER START
          </button>
        </div>

        <div class="arcade-btn-group">
          <label for="colorModeSelect" class="sr-only" style="display:none;">Color Overlay:</label>
          <select id="colorModeSelect" class="select-arcade" title="Cycle Color Mode (Keyboard: C)">
            <option value="0">1978 Lunar Backdrop (Pepper's Ghost)</option>
            <option value="1">1978 Cellophane (Original)</option>
            <option value="2">Retro Neon Arcade</option>
            <option value="3">1978 Monochrome B&amp;W</option>
            <option value="4">Phosphor Green CRT</option>
            <option value="5">Phosphor Amber CRT</option>
          </select>
        </div>
      </div>

      <!-- Action Row: Left / Right Arrows & Heavy Red FIRE Button -->
      <div class="panel-play-row">
        <div class="dpad-container">
          <button id="btnLeft" class="btn-dpad" aria-label="Move Cannon Left" title="Left Arrow / A">◀</button>
          <button id="btnRight" class="btn-dpad" aria-label="Move Cannon Right" title="Right Arrow / D">▶</button>
        </div>

        <button id="btnFire" class="btn-fire" aria-label="Fire Laser Cannon" title="Fire Laser (Keyboard: Spacebar or Tap Screen)">
          FIRE
        </button>
      </div>

      <!-- Settings & Audio Controls Footer -->
      <div class="cabinet-footer">
        <div class="footer-controls">
          <label class="toggle-label" title="Toggle CRT Scanline Shader">
            <input type="checkbox" id="chkScanlines" checked>
            <span>Scanlines</span>
          </label>
          <label class="toggle-label" title="Toggle Curved Glass CRT Bezel">
            <input type="checkbox" id="chkCurved" checked>
            <span>Curved CRT</span>
          </label>
          <label class="toggle-label" title="Toggle Pepper's Ghost Lower Shelf Mirror Reflection">
            <input type="checkbox" id="chkMirror" checked>
            <span>Mirror Shelf</span>
          </label>
        </div>

        <div class="footer-audio">
          <button id="btnMute" class="btn-arcade-sm" title="Toggle Sound (Keyboard: M)">
            🔊 SOUND ON
          </button>
          <label for="volSlider" class="sr-only" style="display:none;">Volume:</label>
          <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.7" class="vol-slider" title="Master Audio Volume">
        </div>
      </div>

    </section>

  </main>

  <!-- Keyboard Shortcuts & Specs Guide -->
  <footer class="keyboard-guide">
    <div><span class="key-badge">Tap Screen</span> Point-and-Click Aim & Fire</div>
    <div><span class="key-badge">◀</span> <span class="key-badge">▶</span> / <span class="key-badge">A</span> <span class="key-badge">D</span> Move</div>
    <div><span class="key-badge">SPACE</span> Fire Laser</div>
    <div><span class="key-badge">1</span> / <span class="key-badge">ENTER</span> Start Game</div>
    <div><span class="key-badge">P</span> Pause</div>
    <div><span class="key-badge">C</span> Cycle Overlay</div>
    <div><span class="key-badge">M</span> Mute</div>
  </footer>

  <!-- Arcade Game Engine Scripts -->
  <script src="js/arcade/sprites.js"></script>
  <script src="js/arcade/audio.js"></script>
  <script src="js/arcade/backdrop.js"></script>
  <script src="js/arcade/bunkers.js"></script>
  <script src="js/arcade/controls.js"></script>
  <script src="js/arcade/game.js"></script>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const backdropCanvas = document.getElementById('backdropCanvas');
      const mirrorCanvas = document.getElementById('mirrorCanvas');
      const mirrorCtx = mirrorCanvas.getContext('2d');
      const cabMirrorShelf = document.getElementById('cabMirrorShelf');

      // Initialize Backdrop & Game Engine
      const backdrop = new SpaceInvadersBackdrop(backdropCanvas);
      const game = new SpaceInvadersGame(canvas, backdropCanvas);

      // DOM Elements
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const btnFire = document.getElementById('btnFire');
      const btnCoin = document.getElementById('btnCoin');
      const btnStart = document.getElementById('btnStart');
      const btnMute = document.getElementById('btnMute');
      const volSlider = document.getElementById('volSlider');
      const colorSelect = document.getElementById('colorModeSelect');
      const chkScanlines = document.getElementById('chkScanlines');
      const chkCurved = document.getElementById('chkCurved');
      const chkMirror = document.getElementById('chkMirror');
      const crtHousing = document.getElementById('crtHousing');
      const crtScanlines = document.getElementById('crtScanlines');
      const marqueeStatus = document.getElementById('marqueeStatus');
      const btnSendScore = document.getElementById('btn-send-score-aac');
      const btnToggleSwitch = document.getElementById('btn-toggle-switch-mode');
      const labelSwitchMode = document.getElementById('label-switch-mode');
      const btnToggleVoice = document.getElementById('btn-toggle-voice-cheers');
      const labelVoiceCheers = document.getElementById('label-voice-cheers');

      // Bind tactile arcade buttons
      SpaceInvadersInput.bindVirtualButtons({
        btnLeft,
        btnRight,
        btnFire,
        btnCoin,
        btnStart
      });

      // Bind Point-and-Click / Touch Finger Tracking directly on canvas
      SpaceInvadersInput.bindPointerCanvas(canvas, 448, 512);
      SpaceInvadersInput.bindPointerCanvas(crtHousing, 448, 512);

      // State variables
      let voiceCheeringEnabled = true;
      let singleSwitchMode = false;
      let sweepDirection = 1;
      let lastKnownScore = 0;
      let lastWaveAnnounced = 0;

      // Voice Synthesizer Cheer Helper
      function cheerPhrase(text) {
        if (!voiceCheeringEnabled || !window.speechSynthesis) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.0;
          utterance.pitch = 1.08;
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn("Voice cheer error:", e);
        }
      }

      // Stats and Marquee Sync
      game.onStatsChange = function (stats) {
        lastKnownScore = stats.score || 0;

        if (stats.state === 0) {
          marqueeStatus.textContent = 'ATTRACT MODE';
        } else if (stats.state === 1) {
          marqueeStatus.textContent = 'WAVE ' + stats.wave;
          if (stats.wave > lastWaveAnnounced && stats.wave > 1) {
            lastWaveAnnounced = stats.wave;
            cheerPhrase('Wave ' + stats.wave + '! Get ready!');
          }
        } else if (stats.state === 5) {
          marqueeStatus.textContent = 'PAUSED';
        } else if (stats.state === 4) {
          marqueeStatus.textContent = 'GAME OVER';
          if (lastKnownScore > 0) {
            cheerPhrase('Great game! Your score is ' + lastKnownScore);
          }
        }
        colorSelect.value = game.currentPaletteIndex;

        // Toggle backdrop canvas visibility based on overlay mode
        if (game.palette.overlayMode === 'lunar') {
          backdropCanvas.style.display = 'block';
        } else {
          backdropCanvas.style.display = 'none';
        }
      };

      // Send Score to AAC Board
      btnSendScore.addEventListener('click', () => {
        const text = lastKnownScore > 0 
          ? `I played Chance Invaders! My score was ${lastKnownScore} points!`
          : `I am playing Chance Invaders arcade game!`;
        sessionStorage.setItem('AAC_INCOMING_DIALOGUE', text);
        window.location.href = 'index.html?fromGame=1';
      });

      // Toggle Single-Switch Assistance
      btnToggleSwitch.addEventListener('click', () => {
        singleSwitchMode = !singleSwitchMode;
        btnToggleSwitch.classList.toggle('active', singleSwitchMode);
        labelSwitchMode.textContent = singleSwitchMode ? '♿ 1-Switch: ON' : '♿ 1-Switch: OFF';
        if (singleSwitchMode) {
          cheerPhrase('Single switch mode enabled. Tap anywhere to fire!');
        }
      });

      // Auto-Sweep Cannon Loop when in Single-Switch Mode
      setInterval(() => {
        if (!singleSwitchMode || game.state !== 1 || !game.player) return;
        const p = game.player;
        p.x += sweepDirection * 2.8;
        if (p.x <= 20) {
          p.x = 20;
          sweepDirection = 1;
        } else if (p.x >= 448 - 40) {
          p.x = 448 - 40;
          sweepDirection = -1;
        }
      }, 30);

      // Any tap or Spacebar in 1-Switch Mode fires laser & inserts coin if in attract mode
      window.addEventListener('pointerdown', (e) => {
        if (singleSwitchMode) {
          if (game.state === 0) {
            game.insertCoin();
            setTimeout(() => game.startGame(), 250);
          } else if (game.state === 1) {
            game.firePlayerLaser();
          }
        }
      });

      // Toggle Voice Cheering
      btnToggleVoice.addEventListener('click', () => {
        voiceCheeringEnabled = !voiceCheeringEnabled;
        labelVoiceCheers.textContent = voiceCheeringEnabled ? '🗣️ Cheer: ON' : '🗣️ Cheer: OFF';
      });

      // Color Mode Select
      colorSelect.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value, 10);
        while (game.currentPaletteIndex !== idx) {
          game.cycleColorMode();
        }
        game.triggerStats();
      });

      // Scanlines Toggle
      chkScanlines.addEventListener('change', (e) => {
        crtScanlines.classList.toggle('disabled', !e.target.checked);
      });

      // Curved Screen Toggle
      chkCurved.addEventListener('change', (e) => {
        crtHousing.classList.toggle('curved', e.target.checked);
      });

      // Cabinet Mirror Shelf Toggle
      chkMirror.addEventListener('change', (e) => {
        cabMirrorShelf.style.display = e.target.checked ? 'flex' : 'none';
      });

      // Mute Toggle
      btnMute.addEventListener('click', () => {
        const isMuted = SpaceInvadersAudio.toggleMute();
        btnMute.textContent = isMuted ? '🔇 MUTED' : '🔊 SOUND ON';
        btnMute.style.color = isMuted ? '#ff4d5a' : '#fff';
      });

      // Volume Slider
      volSlider.addEventListener('input', (e) => {
        SpaceInvadersAudio.setVolume(parseFloat(e.target.value));
      });

      // Unlock audio on initial interaction
      document.body.addEventListener('pointerdown', () => {
        SpaceInvadersAudio.ensureUnlocked();
      }, { once: true });

      // Ambient Animation Loop (Diorama Stars Twinkle & Lower Glass Mirror Reflection)
      let mirrorFrameSkip = 0;
      function renderCabinetFx() {
        if (game.palette.overlayMode === 'lunar') {
          backdrop.render(backdropCanvas.width, backdropCanvas.height);
        }

        mirrorFrameSkip++;
        if (mirrorFrameSkip % 2 === 0 && chkMirror.checked) {
          mirrorCtx.clearRect(0, 0, mirrorCanvas.width, mirrorCanvas.height);
          mirrorCtx.drawImage(
            canvas,
            0, canvas.height - 180, canvas.width, 180,
            0, 0, mirrorCanvas.width, mirrorCanvas.height
          );
        }

        requestAnimationFrame(renderCabinetFx);
      }
      requestAnimationFrame(renderCabinetFx);

      // Start Arcade Engine
      game.start();
    })();
  </script>
</body>
</html>
